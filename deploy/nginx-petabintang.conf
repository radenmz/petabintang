# Peta Bintang — Nginx reverse proxy
#
# Install to /etc/nginx/sites-available/petabintang, then symlink into
# sites-enabled. See docs/DEPLOY.md (Fase 12) for full instructions.
#
# Replace domain-anda.com with your real domain (both places).
# Certbot (Fase 14) will edit this file to add the HTTPS server block.

server {
    listen 80;
    server_name domain-anda.com www.domain-anda.com;

    # The app accepts JSON bodies up to 50mb (server.ts express.json limit).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Original request info. X-Forwarded-* is REQUIRED so the server builds
        # correct absolute URLs (e.g. the ebook access link in the paid email,
        # server.ts uses req.protocol + req.get('host')).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # PDF generation runs headless Chromium and can take up to ~60s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
